# meYou - build an installable APK on GitHub (no EAS needed).
# Run from the repo's Actions tab > "Build APK" > "Run workflow".
# The APK is attached to a pre-release on the Releases page (and kept as a 1-day artifact).

name: Build APK

on:
  workflow_dispatch:
    inputs:
      abis:
        description: "CPU types to build. arm64-v8a is every phone of the last ~8 years; add armeabi-v7a only for old 32-bit phones (build takes longer)."
        default: "arm64-v8a"
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      # The pnpm version is read from packageManager in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install packages
        run: pnpm install --frozen-lockfile

      - name: Check the code
        run: |
          pnpm typecheck
          pnpm test

      # Firebase config for push. GOOGLE_SERVICES_JSON is a repository secret
      # containing base64-encoded google-services.json. The script never prints it.
      - name: Write google-services.json from the secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: node scripts/write-google-services.mjs

      # Creates android/ from app.json (including configured plugins).
      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install

      # Gradle downloads and compiled library outputs are reused between runs.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'app.json', 'package.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build the release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --build-cache --parallel -PreactNativeArchitectures=${{ inputs.abis || 'arm64-v8a' }} -Dorg.gradle.jvmargs="-Xmx4g"

      # Report the SHA-1 of the certificate that actually signed the APK.
      - name: Show actual release APK SHA-1
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "Release APK not found."
            exit 1
          fi
          echo "APK: $APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo "apksigner not found in Android SDK build-tools."
            exit 1
          fi
          "$APKSIGNER" verify --print-certs "$APK"

      # Artifacts count against the Actions storage quota. Keep them for 1 day
      # only, and do not fail the build if the quota is full.
      - name: Upload the APK
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: meyou-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      # Release assets do not use the Actions artifact quota. The APK is
      # attached to a pre-release named build-<run number> on the Releases page.
      - name: Publish the APK as a GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" android/app/build/outputs/apk/release/app-release.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Build ${{ github.run_number }}" \
            --notes "Automated APK build from commit ${{ github.sha }}" \
            --prerelease
