# meYou - build an installable APK on GitHub (no EAS needed).
# Run from the repo's Actions tab > "Build APK" > "Run workflow".
# The APK appears under Artifacts after a successful run.

name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      # The pnpm version is read from packageManager in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Print debug SHA-1 and later inspect the certificate on the actual APK.
      - name: Show Android debug certificate SHA-1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"

          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -storetype JKS \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

          echo "=== DEBUG CERTIFICATE SHA-1 ==="
          keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            | grep -E 'SHA1:|SHA-1:' || true

      - name: Install packages
        run: pnpm install --frozen-lockfile

      # The live-server test starts the real server and skips itself if its
      # packages are missing, so install those packages first.
      - name: Install server packages (for the live-server test)
        working-directory: server/meyou-server
        run: npm ci

      - name: Check the code
        run: |
          pnpm typecheck
          pnpm test

      # Firebase config for push. GOOGLE_SERVICES_JSON is a repository secret
      # containing base64-encoded google-services.json. The script never prints it.
      - name: Write google-services.json from the secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: node scripts/write-google-services.mjs

      # Creates android/ from app.json (including configured plugins).
      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build the release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a -Dorg.gradle.jvmargs="-Xmx4g"

      # Report the SHA-1 of the certificate that actually signed the APK.
      - name: Show actual release APK SHA-1
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "Release APK not found."
            exit 1
          fi
          echo "APK: $APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo "apksigner not found in Android SDK build-tools."
            exit 1
          fi
          "$APKSIGNER" verify --print-certs "$APK"

      # Artifacts count against the Actions storage quota. Keep them for 1 day
      # only, and do not fail the build if the quota is full.
      - name: Upload the APK
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: meyou-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      # Release assets do not use the Actions artifact quota. The APK is
      # attached to a pre-release named build-<run number> on the Releases page.
      - name: Publish the APK as a GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" android/app/build/outputs/apk/release/app-release.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Build ${{ github.run_number }}" \
            --notes "Automated APK build from commit ${{ github.sha }}" \
            --prerelease
